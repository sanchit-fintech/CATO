[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cato-agent"
version = "0.6.0"
description = "A local-first CLI personal-agent prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
cato = "core.cato:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
